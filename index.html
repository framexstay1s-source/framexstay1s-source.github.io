<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профили команды</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f5f6fb;
      background: #07090f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Живой градиентный фон ---- */
    .bg { position: fixed; inset: 0; z-index: -2; overflow: hidden;
      background:
        radial-gradient(120% 90% at 18% -5%, #10173d 0%, transparent 55%),
        radial-gradient(100% 80% at 85% 100%, #1a0f2e 0%, transparent 60%),
        linear-gradient(165deg, #0b0f22 0%, #0a0c18 55%, #07080f 100%);
    }
    .blob { position: absolute; border-radius: 50%; filter: blur(85px); opacity: .5; will-change: transform; }
    .blob.b1 { width: 480px; height: 480px; left: -140px; top: -120px; background: radial-gradient(circle, #2d7dff, transparent 70%); animation: drift 16s ease-in-out infinite alternate; }
    .blob.b2 { width: 520px; height: 520px; right: -160px; top: 8%; background: radial-gradient(circle, #a44dff, transparent 70%); animation: drift 21s ease-in-out infinite alternate-reverse; }
    .blob.b3 { width: 460px; height: 460px; left: 6%; bottom: -180px; background: radial-gradient(circle, #ff4d88, transparent 70%); animation: drift 19s ease-in-out infinite alternate; }
    .blob.b4 { width: 420px; height: 420px; right: 22%; bottom: -140px; background: radial-gradient(circle, #ff7a3d, transparent 70%); opacity: .32; animation: drift 24s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(46px,-34px) scale(1.14); } }

    /* ---- Liquid glass ---- */
    .glass {
      background: linear-gradient(150deg, rgba(255,255,255,.17), rgba(255,255,255,.055) 42%, rgba(255,255,255,.10));
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.06);
      backdrop-filter: blur(30px) saturate(1.7);
      -webkit-backdrop-filter: blur(30px) saturate(1.7);
    }

    .landing {
      width: 100%;
      max-width: 1180px;
      border-radius: 36px;
      padding: 36px 32px 32px;
      position: relative;
      overflow: hidden;
    }
    h1 {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1.02;
      margin-bottom: 10px;
      background: linear-gradient(180deg, #ffffff 30%, rgba(255,255,255,.62));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { color: rgba(255,255,255,.66); margin-bottom: 26px; font-size: 16px; line-height: 1.5; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: 16px; position: relative; }
    a { color: inherit; text-decoration: none; }

    .pcard {
      --a1: #9fb6ff; --a2: #5c8dff; --glow: rgba(92,141,255,.45);
      position: relative;
      min-height: 252px;
      border-radius: 28px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      overflow: hidden;
      transition: transform .25s cubic-bezier(.22,.9,.34,1.2), box-shadow .25s ease, border-color .25s ease, background .25s ease;
    }
    .pcard::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 32%, rgba(255,255,255,.16) 48%, rgba(255,255,255,.30) 50%, rgba(255,255,255,.16) 52%, transparent 68%);
      transform: translateX(-130%);
      transition: transform .8s ease;
      pointer-events: none;
    }
    .pcard:hover { transform: translateY(-6px) scale(1.015); border-color: rgba(255,255,255,.38); box-shadow: 0 30px 70px rgba(0,0,0,.5), 0 0 34px var(--glow), inset 0 1px 0 rgba(255,255,255,.45); }
    .pcard:hover::after { transform: translateX(130%); }

    .avatar {
      width: 116px; height: 116px;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,.35);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 12px 26px rgba(0,0,0,.4);
      background: rgba(255,255,255,.08);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .person { position: relative; }
    .name { font-size: 25px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 4px; }
    .role {
      display: inline-block;
      font-weight: 700;
      font-size: 14.5px;
      background: linear-gradient(100deg, #fff 0%, var(--a1) 55%, var(--a2) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 7px;
    }
    .nick { color: rgba(255,255,255,.58); font-size: 13px; }

    .andrey-card { --a1: #9fd0ff; --a2: #2d7dff; --glow: rgba(45,125,255,.42); }
    .artem-card  { --a1: #ffc39f; --a2: #ff5c40; --glow: rgba(255,92,64,.40); }
    .diana-card  { --a1: #ffb1e8; --a2: #c86bff; --glow: rgba(200,107,255,.40); }
    .makar-card  { --a1: #ff9fae; --a2: #d31a3c; --glow: rgba(211,26,60,.42); }
    .lisabon-card{ --a1: #cbb2ff; --a2: #7a4dff; --glow: rgba(122,77,255,.42); }

    .sponsor-button {
      position: fixed;
      z-index: 50;
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 176px;
      padding: 14px 20px;
      border-radius: 999px;
      color: rgba(255,255,255,.94);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: transform .22s ease, box-shadow .22s ease;
    }
    .sponsor-button:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 26px 60px rgba(0,0,0,.5), 0 0 30px rgba(255,255,255,.14), inset 0 1px 0 rgba(255,255,255,.4); }
    .sponsor-button.corner-tl { left: 22px; top: 22px; }
    .sponsor-button.corner-tr { right: 22px; top: 22px; }
    .sponsor-button.corner-bl { left: 22px; bottom: 22px; }
    .sponsor-button.corner-br { right: 22px; bottom: 22px; }

    @media (max-width: 860px) {
      .cards { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      body { padding: 24px 12px; }
      .landing { padding: 24px 18px; border-radius: 28px; }
      h1 { font-size: 36px; }
      .cards { grid-template-columns: 1fr; }
      .pcard { min-height: 0; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  </div>

  <main class="landing glass">
    <h1>Профили команды</h1>
    <p class="sub">Выбери участника, чтобы открыть его биографию.</p>

    <div class="cards">
      <a class="pcard glass andrey-card" href="andrey/">
        <div class="avatar"><img src="assets/andrey-avatar.jpg" alt="Аватар Андрея"></div>
        <div class="person">
          <div class="name">Андрей</div>
          <div class="role">Генеральный директор</div>
          <div class="nick">2009andrey2611R5</div>
        </div>
      </a>

      <a class="pcard glass artem-card" href="wadfera/">
        <div class="avatar"><img src="assets/artem-avatar.png" alt="Аватар Артёма"></div>
        <div class="person">
          <div class="name">Артём</div>
          <div class="role">Директор</div>
          <div class="nick">wadfera</div>
        </div>
      </a>

      <a class="pcard glass diana-card" href="kiwssaq/">
        <div class="avatar"><img src="assets/diana-avatar.jpg" alt="Аватар Дианы"></div>
        <div class="person">
          <div class="name">Диана</div>
          <div class="role">Волевой Синклинтовец</div>
          <div class="nick">kiwssaq0</div>
        </div>
      </a>

      <a class="pcard glass makar-card" href="xstay1s/">
        <div class="avatar"><img src="assets/makar-avatar-new.jpg" alt="Аватар Макара"></div>
        <div class="person">
          <div class="name">Макар</div>
          <div class="role">Сиделка, Директор</div>
          <div class="nick">Xstay1s</div>
        </div>
      </a>

      <a class="pcard glass lisabon-card" href="h2o_wlw_82627/">
        <div class="avatar"><img src="assets/lisbon-avatar2.jpg" alt="Аватар Лиссабон"></div>
        <div class="person">
          <div class="name">Лиссабон</div>
          <div class="role">Волевой Синклинтовец</div>
          <div class="nick">h2o_wlw_82627</div>
        </div>
      </a>
    </div>
  </main>

  <a class="sponsor-button glass" id="sponsorButton" href="https://x1dems.pages.dev" target="_blank" rel="noopener">
    <span>Сайт спонсора</span>
  </a>

  <script>
    const sponsorButton = document.getElementById('sponsorButton');
    const sponsorCorners = ['corner-tl', 'corner-tr', 'corner-bl', 'corner-br'];
    sponsorButton.classList.add(sponsorCorners[Math.floor(Math.random() * sponsorCorners.length)]);

    // ---- Кодаи ----
    function showToast(msg) {
      let t = document.getElementById('funToast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'funToast';
        t.style.cssText = 'position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);z-index:300;padding:14px 22px;border-radius:999px;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(150deg,rgba(255,255,255,.18),rgba(255,255,255,.05)),rgba(12,14,24,.72);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 18px 45px rgba(0,0,0,.5);opacity:0;transition:.3s ease;max-width:82vw;text-align:center;';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      requestAnimationFrame(() => { t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)'; });
      clearTimeout(t._h);
      t._h = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2600);
    }

    function confettiBurst() {
      const cv = document.createElement('canvas');
      cv.width = innerWidth; cv.height = innerHeight;
      cv.style.cssText = 'position:fixed;inset:0;z-index:200;pointer-events:none;';
      document.body.appendChild(cv);
      const ctx = cv.getContext('2d');
      const colors = ['#9fd0ff', '#ffc39f', '#ffb1e8', '#cbb2ff', '#ff9fae', '#ffffff'];
      const ps = Array.from({ length: 160 }, () => ({
        x: innerWidth / 2, y: innerHeight / 2.2,
        vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 3,
        s: Math.random() * 8 + 4, c: colors[(Math.random() * colors.length) | 0],
        r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3
      }));
      let t = 0;
      (function tick() {
        t++;
        ctx.clearRect(0, 0, cv.width, cv.height);
        let alive = false;
        for (const p of ps) {
          p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
          if (p.y < cv.height + 20) alive = true;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
          ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6);
          ctx.restore();
        }
        if (alive && t < 240) requestAnimationFrame(tick); else cv.remove();
      })();
    }

    const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
    let kpos = 0;
    document.addEventListener('keydown', (e) => {
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (k === KONAMI[kpos]) {
        kpos++;
        if (kpos === KONAMI.length) {
          kpos = 0;
          confettiBurst();
          showToast('🎉 КОДАЙ СРАБОТАЛ');
        }
      } else {
        kpos = (k === KONAMI[0]) ? 1 : 0;
      }
    });
  </script>

</body>
</html>
